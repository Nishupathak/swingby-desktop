<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'">
<title>SwingBy overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div class="anchor">
    <div class="swing" id="swing">
      <svg class="hero" viewBox="0 0 160 330" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <line x1="74" y1="0" x2="74" y2="146" stroke="#8f98c0" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M74 152 L84 200" stroke="#d92d41" stroke-width="13" stroke-linecap="round" fill="none"/>
        <circle cx="74" cy="148" r="8" fill="#e8eaf2" stroke="#05060a" stroke-width="3"/>
        <path d="M52 204 Q66 196 86 204 L92 262 Q70 276 50 262 Z" fill="#141a3a" stroke="#05060a" stroke-width="4" stroke-linejoin="round"/>
        <path d="M70 218 q-8 11 0 17 q8 -6 0 -17z" fill="#e8eaf2" stroke="#05060a" stroke-width="2"/>
        <path d="M56 214 Q40 226 40 246" stroke="#d92d41" stroke-width="12" stroke-linecap="round" fill="none"/>
        <circle cx="40" cy="248" r="7" fill="#e8eaf2" stroke="#05060a" stroke-width="3"/>
        <path d="M58 262 L50 308" stroke="#141a3a" stroke-width="14" stroke-linecap="round"/>
        <path d="M82 262 L92 304" stroke="#141a3a" stroke-width="14" stroke-linecap="round"/>
        <ellipse cx="48" cy="314" rx="11" ry="6" fill="#d92d41" stroke="#05060a" stroke-width="3"/>
        <ellipse cx="96" cy="310" rx="11" ry="6" fill="#d92d41" stroke="#05060a" stroke-width="3"/>
        <circle cx="66" cy="184" r="21" fill="#d92d41" stroke="#05060a" stroke-width="4"/>
        <path d="M66 164 V204 M46 184 H86 M52 170 Q66 184 52 198 M80 170 Q66 184 80 198" stroke="#05060a" stroke-width="1" opacity=".5" fill="none"/>
        <path d="M52 180 Q58 174 66 182 Q60 190 52 186 Z" fill="#f4f6ff" stroke="#05060a" stroke-width="2.5"/>
        <path d="M80 180 Q74 174 66 182 Q72 190 80 186 Z" fill="#f4f6ff" stroke="#05060a" stroke-width="2.5"/>
      </svg>

      <div class="bubble" id="bubble" role="alert">
        <div class="dots" id="dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div id="body" hidden>
          <p class="title" id="title"></p>
          <p class="text" id="text"></p>
          <div class="row" id="row" hidden>
            <button class="done" id="doneBtn">Done</button>
            <button class="snooze" id="snoozeBtn">Snooze 5 min</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
